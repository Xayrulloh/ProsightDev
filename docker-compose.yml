services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: prosight-locus-api:latest
    container_name: prosight-locus-api
    restart: unless-stopped
    ports:
      - "${PORT:-5555}:${PORT:-5555}"
    env_file:
      - .env
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --spider -q http://localhost:${PORT:-5555}/api || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
